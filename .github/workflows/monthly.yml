name: NextTech — Generación mensual

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  # Generación automática con 8 días de antelación a la publicación.
  # ─────────────────────────────────────────────────────────────────
  # FLUJO (desde 2026-07-20, decisión editorial de Miguel):
  #   · Publicación (envío a todos) → primer LUNES del mes (acción manual de Miguel)
  #   · Generación automática       → el DOMINGO exactamente 8 días antes
  #     (cae siempre entre los días 21 y 30 del mes anterior)
  #
  # El cron corre TODOS los domingos a las 07:00 UTC (09:00 Madrid en verano,
  # 08:00 en invierno) SIN restricción de día de mes. Así no existe el OR
  # día-de-mes/día-de-semana de GitHub Actions que provocó generaciones en
  # días no deseados (la #02 se generó el jueves 25-jun en vez del miércoles 24).
  #
  # El primer paso del job decide si hoy es EL domingo: si hoy es domingo,
  # hoy+8 días es siempre un lunes; si además cae en día 1-7 del mes,
  # es el PRIMER lunes → se genera. Los demás domingos el job sale sin
  # hacer nada.
  # ─────────────────────────────────────────────────────────────────
  schedule:
    - cron: "0 7 * * 0"

  # Lanzamiento manual desde GitHub Actions (para tests y ediciones urgentes)
  workflow_dispatch:
    inputs:
      edition_number:
        description: "Número de edición (ej: 01). Déjalo vacío para calcular automáticamente."
        required: false
        default: "auto"
      publication_date:
        description: "Fecha de publicación YYYY-MM-DD (fija mes/año de cabecera y etiquetas). 'auto' = hoy + 8 días."
        required: false
        default: "auto"

jobs:
  generate-nexttech:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # Necesario para el push a gh-pages

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 📅 Verificar ventana de generación (domingo 8 días antes del primer lunes)
        id: check_date
        run: |
          DOW=$(date -u +%u)                       # 1=lunes … 7=domingo
          TARGET_DAY=$(date -u -d '+8 days' +%-d)  # día del mes de hoy+8
          # PUBLICATION_DATE: ÚNICA fuente de la fecha de publicación para todo
          # el pipeline. El cálculo "+8 días" solo vive aquí; los scripts Python
          # la leen vía pubdate.py.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ -n "${{ github.event.inputs.publication_date }}" ] \
             && [ "${{ github.event.inputs.publication_date }}" != "auto" ]; then
            PUB_DATE="${{ github.event.inputs.publication_date }}"
          else
            PUB_DATE=$(date -u -d '+8 days' +%Y-%m-%d)
          fi
          MESES=(- Enero Febrero Marzo Abril Mayo Junio Julio Agosto Septiembre Octubre Noviembre Diciembre)
          PUB_LABEL="${MESES[$(date -u -d "$PUB_DATE" +%-m)]} $(date -u -d "$PUB_DATE" +%Y)"
          echo "publication_date=$PUB_DATE"   >> $GITHUB_OUTPUT
          echo "publication_label=$PUB_LABEL" >> $GITHUB_OUTPUT
          # Guard con comprobación AND explícita (mismo patrón que reminder.yml):
          # GitHub evalúa los crons con OR, así que el bash impone las condiciones.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Lanzamiento manual — ignorando restricción de fecha. Publicación: $PUB_DATE ($PUB_LABEL)."
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [ "$DOW" != "7" ] || [ "$TARGET_DAY" -gt 7 ]; then
            echo "Hoy es DOW=$DOW y hoy+8 días cae en día $TARGET_DAY — no es el domingo 8 días antes del primer lunes. Cancelando."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Domingo 8 días antes del primer lunes. Generando — publicación: $PUB_DATE ($PUB_LABEL)."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 🐍 Configurar Python
        if: steps.check_date.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Instalar dependencias
        if: steps.check_date.outputs.skip == 'false'
        run: pip install -r requirements.txt

      - name: 🔢 Calcular número de edición
        if: steps.check_date.outputs.skip == 'false'
        id: edition
        run: |
          if [ "${{ github.event.inputs.edition_number }}" = "auto" ] || [ -z "${{ github.event.inputs.edition_number }}" ]; then
            # Numeración por MES DE PUBLICACIÓN (no de generación): #01 = Junio 2026.
            # Ej.: generado el 25-dic-2026 → publicación 6-ene-2027 → #08.
            PUB_DATE="${{ steps.check_date.outputs.publication_date }}"
            MONTH=$(date -u -d "$PUB_DATE" +%-m)
            YEAR=$(date -u -d "$PUB_DATE" +%Y)
            START_MONTH=6
            START_YEAR=2026
            EDITION=$(( (YEAR - START_YEAR) * 12 + MONTH - START_MONTH + 1 ))
            printf -v EDITION_STR "%02d" $EDITION
          else
            EDITION_STR="${{ github.event.inputs.edition_number }}"
          fi
          echo "number=$EDITION_STR" >> $GITHUB_OUTPUT
          echo "  📌 Edición: #$EDITION_STR"

      - name: 🚀 Generar y enviar NextTech
        if: steps.check_date.outputs.skip == 'false'
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          MS_TENANT_ID:       ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID:       ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET:   ${{ secrets.MS_CLIENT_SECRET }}
          MS_SENDER_EMAIL:    ${{ secrets.MS_SENDER_EMAIL }}
          REVIEWER_EMAIL:     ${{ secrets.REVIEWER_EMAIL }}
          EDITION_NUMBER:     ${{ steps.edition.outputs.number }}
          PUBLICATION_DATE:   ${{ steps.check_date.outputs.publication_date }}
        run: python main.py

      - name: 🌍 Traducir a EN/FR (i18n)
        if: steps.check_date.outputs.skip == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -f "index.html" ]; then
            python translator.py index.html || echo "⚠️ Traducción fallida — se publica solo en ES."
          fi

      - name: 🌐 Publicar en carpeta de edición (GitHub Pages)
        if: steps.check_date.outputs.skip == 'false'
        env:
          PUBLICATION_DATE: ${{ steps.check_date.outputs.publication_date }}
        run: |
          EDITION="${{ steps.edition.outputs.number }}"
          EDITION_FILE="${EDITION}/index.html"
          # Si main.py hizo skip (edición ya existe), no hay index.html — nada que publicar
          if [ ! -f "index.html" ]; then
            echo "⏭️ No hay index.html generado — main.py hizo skip de edición existente."
            exit 0
          fi
          # Protección adicional: no sobreescribir edición ya publicada
          if [ -f "$EDITION_FILE" ]; then
            echo "⏭️ ${EDITION_FILE} ya existe — edición publicada protegida. Skip."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p "${EDITION}"
          cp index.html "${EDITION_FILE}"
          # Redirect de la raíz → última edición publicada (carpeta NN/ más alta)
          LATEST=$(ls -d [0-9][0-9]/ 2>/dev/null | sort | tail -1 | tr -d '/')
          [ -z "$LATEST" ] && LATEST="${EDITION}"
          printf '<!DOCTYPE html>\n<html lang="es">\n<head>\n<meta charset="UTF-8">\n<meta http-equiv="refresh" content="0; url=/%s/">\n<link rel="canonical" href="https://nexttech.lognext.com/%s/">\n<title>NextTech — LOGNEXT</title>\n<script>window.location.replace("/%s/");</script>\n</head>\n<body>\n<p>Redirigiendo a la última edición de NextTech. Si no te redirige, <a href="/%s/">haz clic aquí</a>.</p>\n</body>\n</html>\n' "$LATEST" "$LATEST" "$LATEST" "$LATEST" > index.html
          # Manifiesto de ediciones publicadas para el navegador del footer (editions-nav.js)
          python gen_editions.py
          git add index.html editions.json "${EDITION}/"
          git diff --staged --quiet || git commit -m "NextTech #${EDITION} publicado — ${{ steps.check_date.outputs.publication_label }}"
          git push origin main

      - name: 🏷️ Nombre de artefacto seguro
        if: always()
        id: artifact_name
        run: |
          NUM="${{ steps.edition.outputs.number }}"
          # Fallback a "00" si el output está vacío o contiene caracteres inválidos
          if [[ -z "$NUM" || "$NUM" == *":"* || "$NUM" == *" "* ]]; then
            NUM="00"
          fi
          echo "name=nexttech-preview-${NUM}" >> $GITHUB_OUTPUT

      - name: 📤 Guardar HTML como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: index.html
          retention-days: 90
