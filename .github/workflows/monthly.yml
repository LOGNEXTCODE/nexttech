name: NextTech — Generación mensual

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  # Generación automática con 7 días de antelación a la publicación.
  # ─────────────────────────────────────────────────────────────────
  # FLUJO:
  #   · Publicación (envío a todos) → primer MIÉRCOLES del mes (acción manual de Miguel)
  #   · Generación automática       → el MIÉRCOLES ANTERIOR, 7 días antes
  #
  # El primer miércoles del mes cae siempre entre los días 1-7.
  # El miércoles previo cae entre los días 25-31 del mes anterior.
  # Por tanto este cron se dispara los MIÉRCOLES (dow=3) de los días 25-31.
  # ─────────────────────────────────────────────────────────────────
  schedule:
    - cron: "0 7 25-31 * 3"

  # Lanzamiento manual desde GitHub Actions (para tests y ediciones urgentes)
  workflow_dispatch:
    inputs:
      edition_number:
        description: "Número de edición (ej: 01). Déjalo vacío para calcular automáticamente."
        required: false
        default: "auto"

jobs:
  generate-nexttech:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # Necesario para el push a gh-pages

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 📅 Verificar ventana de generación (miércoles previo al primer miércoles)
        id: check_date
        run: |
          DAY=$(date +%-d)
          # En workflow_dispatch siempre se ejecuta (test manual)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Lanzamiento manual — ignorando restricción de fecha."
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [ "$DAY" -lt 25 ]; then
            echo "Hoy es día $DAY — fuera de la ventana 25-31. Cancelando."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Hoy es día $DAY — miércoles previo al primer miércoles del mes. Generando con 7 días de antelación."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 🐍 Configurar Python
        if: steps.check_date.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Instalar dependencias
        if: steps.check_date.outputs.skip == 'false'
        run: pip install -r requirements.txt

      - name: 🔢 Calcular número de edición
        if: steps.check_date.outputs.skip == 'false'
        id: edition
        run: |
          if [ "${{ github.event.inputs.edition_number }}" = "auto" ] || [ -z "${{ github.event.inputs.edition_number }}" ]; then
            MONTH=$(date +%-m)
            START_MONTH=5
            START_YEAR=2026
            YEAR=$(date +%Y)
            EDITION=$(( (YEAR - START_YEAR) * 12 + MONTH - START_MONTH + 1 ))
            printf -v EDITION_STR "%02d" $EDITION
          else
            EDITION_STR="${{ github.event.inputs.edition_number }}"
          fi
          echo "number=$EDITION_STR" >> $GITHUB_OUTPUT
          echo "  📌 Edición: #$EDITION_STR"

      - name: 🚀 Generar y enviar NextTech
        if: steps.check_date.outputs.skip == 'false'
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          MS_TENANT_ID:       ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID:       ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET:   ${{ secrets.MS_CLIENT_SECRET }}
          MS_SENDER_EMAIL:    ${{ secrets.MS_SENDER_EMAIL }}
          REVIEWER_EMAIL:     ${{ secrets.REVIEWER_EMAIL }}
          EDITION_NUMBER:     ${{ steps.edition.outputs.number }}
        run: python main.py

      - name: 🌍 Traducir a EN/FR (i18n)
        if: steps.check_date.outputs.skip == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -f "index.html" ]; then
            python translator.py index.html || echo "⚠️ Traducción fallida — se publica solo en ES."
          fi

      - name: 🌐 Publicar en carpeta de edición (GitHub Pages)
        if: steps.check_date.outputs.skip == 'false'
        run: |
          EDITION="${{ steps.edition.outputs.number }}"
          EDITION_FILE="${EDITION}/index.html"
          # Si main.py hizo skip (edición ya existe), no hay index.html — nada que publicar
          if [ ! -f "index.html" ]; then
            echo "⏭️ No hay index.html generado — main.py hizo skip de edición existente."
            exit 0
          fi
          # Protección adicional: no sobreescribir edición ya publicada
          if [ -f "$EDITION_FILE" ]; then
            echo "⏭️ ${EDITION_FILE} ya existe — edición publicada protegida. Skip."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p "${EDITION}"
          cp index.html "${EDITION_FILE}"
          # Redirect de la raíz → última edición publicada (carpeta NN/ más alta)
          LATEST=$(ls -d [0-9][0-9]/ 2>/dev/null | sort | tail -1 | tr -d '/')
          [ -z "$LATEST" ] && LATEST="${EDITION}"
          printf '<!DOCTYPE html>\n<html lang="es">\n<head>\n<meta charset="UTF-8">\n<meta http-equiv="refresh" content="0; url=/%s/">\n<link rel="canonical" href="https://nexttech.lognext.com/%s/">\n<title>NextTech — LOGNEXT</title>\n<script>window.location.replace("/%s/");</script>\n</head>\n<body>\n<p>Redirigiendo a la última edición de NextTech. Si no te redirige, <a href="/%s/">haz clic aquí</a>.</p>\n</body>\n</html>\n' "$LATEST" "$LATEST" "$LATEST" "$LATEST" > index.html
          # Manifiesto de ediciones publicadas para el navegador del footer (editions-nav.js)
          python gen_editions.py
          git add index.html editions.json "${EDITION}/"
          git diff --staged --quiet || git commit -m "NextTech #${EDITION} publicado — $(date +'%B %Y')"
          git push origin main

      - name: 🏷️ Nombre de artefacto seguro
        if: always()
        id: artifact_name
        run: |
          NUM="${{ steps.edition.outputs.number }}"
          # Fallback a "00" si el output está vacío o contiene caracteres inválidos
          if [[ -z "$NUM" || "$NUM" == *":"* || "$NUM" == *" "* ]]; then
            NUM="00"
          fi
          echo "name=nexttech-preview-${NUM}" >> $GITHUB_OUTPUT

      - name: 📤 Guardar HTML como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: index.html
          retention-days: 90
