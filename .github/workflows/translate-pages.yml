name: Traducir página estática (i18n)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      html_file:
        description: "Ruta al fichero HTML a traducir (ej: GuiaEtiquetas/index.html)"
        required: true
        default: "GuiaEtiquetas/index.html"

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Instalar dependencias
        run: pip install -r requirements.txt

      - name: 🌍 Traducir a EN/FR
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python translator.py "${{ github.event.inputs.html_file }}"

      - name: 🔀 Abrir PR de revisión con las traducciones (NO publica en main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="${{ github.event.inputs.html_file }}"
          # Si translator.py no produjo cambios, no hay nada que revisar.
          if git diff --quiet -- "$FILE"; then
            echo "Sin cambios — nada que traducir/commitear. No se abre PR."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Rama de revisión única por ejecución (nombre seguro derivado del fichero).
          SLUG="$(echo "$FILE" | tr '/.' '--')"
          BRANCH="i18n/${SLUG}-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add "$FILE"
          git commit -m "i18n: traducciones EN/FR — $FILE"
          git push origin "$BRANCH"
          # Abre la PR contra main; la revisión y el merge son manuales.
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "i18n: traducciones EN/FR — $FILE" \
            --body "Traducciones automáticas EN/FR generadas por \`translator.py\` para \`$FILE\`. Revisar antes de fusionar. No se ha tocado el contenido en español."
