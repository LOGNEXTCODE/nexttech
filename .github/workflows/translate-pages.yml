name: Traducir página estática (i18n)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      html_file:
        description: "Ruta al fichero HTML a traducir (ej: GuiaEtiquetas/index.html)"
        required: true
        default: "GuiaEtiquetas/index.html"

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Instalar dependencias
        run: pip install -r requirements.txt

      - name: 🌍 Traducir a EN/FR
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python translator.py "${{ github.event.inputs.html_file }}"

      - name: 💾 Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.html_file }}"
          git diff --staged --quiet && echo "Sin cambios — nada que commitear." || \
            git commit -m "i18n: traducciones EN/FR — ${{ github.event.inputs.html_file }}" && \
            git push origin main
