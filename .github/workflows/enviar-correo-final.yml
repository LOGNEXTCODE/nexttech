name: NextTech — Enviar correo final (a sistemas@, para reenvío)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Envía el correo de anuncio de una edición (correo/anuncio-NN.html) SOLO a
# REVIEWER_EMAIL (sistemas@). NUNCA a la organización: el reenvío es manual
# de Miguel desde Outlook. Solo se ejecuta a mano (workflow_dispatch).
on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Edición cuyo correo enviar (ej: 03). Debe existir correo/anuncio-NN.html."
        required: true
        default: "03"

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 📧 Enviar a REVIEWER_EMAIL
        env:
          MS_TENANT_ID:     ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID:     ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_SENDER_EMAIL:  ${{ secrets.MS_SENDER_EMAIL }}
          REVIEWER_EMAIL:   ${{ secrets.REVIEWER_EMAIL }}
        run: |
          ED="${{ github.event.inputs.edition }}"
          if ! echo "$ED" | grep -qE '^[0-9]{2}$'; then
            echo "::error::Formato inválido: '$ED' (esperado NN)"; exit 1
          fi
          FILE="correo/anuncio-${ED}.html"
          if [ ! -f "$FILE" ]; then
            echo "::error::No existe $FILE"; exit 1
          fi
          pip install -q requests
          python3 enviar_correo.py "$FILE"
